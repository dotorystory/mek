  <head>

    <title>Let's MEK</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Meta refresh 제거 - JavaScript가 리다이렉트 처리 -->
    <style>
      .select-language-page-body {
        background: #0f253f url('root-bg.png') no-repeat top left fixed;
        background-size: cover;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
      }
      .container {
        text-align: center;
        padding: 40px 30px;
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 2.0em;
        color: #ffffff;
        box-sizing: border-box;
        background: rgba(15, 37, 63, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        max-width: 800px;
        width: 90%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        animation: modalFadeIn 0.5s ease;
        position: relative;
      }
      
      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #ffffff;
        transition: all 0.3s ease;
        text-decoration: none;
      }
      
      .close-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: #64b5f6;
        transform: rotate(90deg);
      }
      .container a {
        color: #64b5f6;
        text-decoration: none;
        transition: color 0.3s ease;
      }
      
      .container a:hover {
        color: #90caf9;
      }
      .loading {
        font-size: 0.8em;
        color: #b0bec5;
        margin-top: 20px;
      }
      
      .flag-buttons {
        margin-top: 30px;
        text-align: center;
      }
      
      .flag-btn {
        display: inline-block;
        width: 200px;
        margin: 6px;
        padding: 13px 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 20px;
        text-decoration: none;
        color: #ffffff;
        min-width: 80px;
        text-align: center;
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
        box-sizing: border-box;
        max-width: calc(100% - 10px);
      }
      
      .flag-btn img {
        width: 32px;
        height: 24px;
        margin-right: 10px;
        vertical-align: middle;
        border-radius: 3px;
      }
      
      .flag-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: #64b5f6;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      }
      
      .flag-btn:active {
        transform: translateY(0);
      }
      
      /* 태블릿/모바일 반응형 */
      @media (max-width: 768px) {
        .container {
          margin: 50px auto;
          padding: 30px 15px;
          box-sizing: border-box;
        }
        
        .flag-btn {
          display: block;
          margin: 10px auto;
          width: 250px;
          max-width: calc(100% - 20px);
          box-sizing: border-box;
          font-size: 22px;
          padding: 12px 18px;
        }
      }
      
      /* 매우 작은 화면 대응 */
      @media (max-width: 480px) {
        .container {
          padding: 20px 10px;
          font-size: 1.8em;
        }
        
        .flag-btn {
          width: 220px;
          max-width: calc(100% - 20px);
          padding: 10px 15px;
          font-size: 24px;
        }
      }
      
      /* 모달 스타일 */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        justify-content: center;
        align-items: center;
      }
      
      .modal-overlay.show {
        display: flex;
      }
      
      .modal-content {
        background: #0f253f;
        border: 2px solid #64b5f6;
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 90%;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        animation: modalFadeIn 0.3s ease;
      }
      
      @keyframes modalFadeIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      
      .modal-content h2 {
        color: #64b5f6;
        margin-top: 0;
        font-size: 1.8em;
      }
      
      .modal-content p {
        color: #ffffff;
        font-size: 1.1em;
        margin: 20px 0;
      }
      
      .modal-buttons {
        margin-top: 30px;
      }
      
      .modal-btn {
        display: inline-block;
        margin: 10px 5px;
        padding: 15px 30px;
        background: #64b5f6;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.1em;
        color: #0f253f;
        font-weight: bold;
        text-decoration: none;
        transition: all 0.3s ease;
      }
      
      .modal-btn:hover {
        background: #90caf9;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(100, 181, 246, 0.4);
      }
      
      .modal-btn.secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
      
      .modal-btn.secondary:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: #64b5f6;
      }
      
      .other-languages {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }
      
      .other-languages p {
        font-size: 0.9em;
        color: #b0bec5;
        margin-bottom: 15px;
      }
      
      .lang-link {
        display: inline-block;
        margin: 5px 10px;
        padding: 8px 15px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #64b5f6;
        text-decoration: none;
        font-size: 0.9em;
        transition: all 0.3s ease;
      }
      
      .lang-link:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #64b5f6;
      }
      
      @media (max-width: 480px) {
        .modal-content {
          padding: 30px 20px;
          width: 95%;
        }
        
        .modal-content h2 {
          font-size: 1.5em;
        }
        
        .modal-btn {
          display: block;
          width: 100%;
          margin: 10px 0;
        }
        
        .lang-link {
          display: block;
          margin: 8px 0;
        }
      }
    </style>
    <script>
      // IP 기반 지역 감지 및 언어 선택 모달
      (function() {
        // 강력한 무한 루프 방지 체크
        if (location.pathname === '/home/' || location.pathname.startsWith('/home/') ||
            location.pathname === '/de/' || location.pathname.startsWith('/de/') ||
            location.pathname === '/en/' || location.pathname.startsWith('/en/') ||
            location.pathname === '/jp/' || location.pathname.startsWith('/jp/') ||
            location.pathname === '/cn/' || location.pathname.startsWith('/cn/')) {
          return;
        }
        
        if (sessionStorage.getItem('mek_modal_shown') === 'true') {
          return;
        }
        
        // 도메인 체크 추가 (localhost 포함)
        if (location.hostname !== 'mekeng.com' && 
            location.hostname !== 'www.mekeng.com' &&
            location.hostname !== 'localhost' && 
            location.hostname !== '127.0.0.1') {
          return;
        }
        
        var search = location.search; // URL 파라미터 유지
        var detectedCountry = null;
        var detectedLang = 'en';
        
        // 베이스 URL 설정 (현재 페이지의 origin 사용)
        var baseUrl = location.origin;
        
        // 사용자가 언어를 선택했는지 추적
        var userSelected = false;
        
        // 언어별 메시지 설정
        var langMessages = {
          'ko': {
            title: '언어 선택',
            message: '엠이케이(주) 한국어 사이트로 이동하시겠습니까?',
            recommended: '한국어 사이트로 이동',
            otherTitle: '다른 언어 선택',
            url: baseUrl + '/home/'
          },
          'cn': {
            title: '选择语言',
            message: '要前往MEK中文网站吗？',
            recommended: '前往中文网站',
            otherTitle: '选择其他语言',
            url: baseUrl + '/cn/'
          },
          'jp': {
            title: '言語選択',
            message: 'MEK日本語サイトに移動しますか？',
            recommended: '日本語サイトへ移動',
            otherTitle: '他の言語を選択',
            url: baseUrl + '/jp/'
          },
          'en': {
            title: 'Select Language',
            message: 'Would you like to visit the MEK English site?',
            recommended: 'Go to English Site',
            otherTitle: 'Choose Other Language',
            url: baseUrl + '/en/'
          },
          'de': {
            title: 'Sprache auswählen',
            message: 'Möchten Sie zur MEK deutschen Website wechseln?',
            recommended: 'Zur deutschen Website',
            otherTitle: 'Andere Sprache wählen',
            url: baseUrl + '/de/'
          },
          'es': {
            title: 'Seleccionar idioma',
            message: '¿Desea visitar el sitio web de MEK en español?',
            recommended: 'Ir al sitio en español',
            otherTitle: 'Elegir otro idioma',
            url: baseUrl + '/es/'
          }
        };
        
        // 리다이렉트 함수
        function redirectToLanguageSite(lang) {
          if (userSelected) {
            console.log('사용자가 이미 언어를 선택했으므로 리다이렉트 취소');
            return;
          }
          var msg = langMessages[lang] || langMessages['en'];
          console.log('Redirecting to:', msg.url + search);
          sessionStorage.setItem('mek_modal_shown', 'true');
          redirected = true;
          location.href = msg.url + search;
        }
        
        // IP 감지 및 리다이렉트 처리
        var redirected = false;
        
        // 5초 후 /home/으로 리다이렉트 (fallback)
        var fallbackTimeout = setTimeout(function() {
          if (!redirected && !userSelected) {
            console.log('IP 감지 실패 또는 타임아웃 (5초), /home/으로 리다이렉트');
            sessionStorage.setItem('mek_modal_shown', 'true');
            redirected = true;
            location.href = baseUrl + '/home/' + search;
          }
        }, 5000);
        
        // 언어 버튼 클릭 시 사용자 선택 플래그 설정
        document.addEventListener('DOMContentLoaded', function() {
          var flagButtons = document.querySelectorAll('.flag-btn');
          flagButtons.forEach(function(btn) {
            btn.addEventListener('click', function() {
              userSelected = true;
              clearTimeout(fallbackTimeout);
              console.log('사용자가 언어를 선택했습니다.');
            });
          });
        });
        
        // 즉시 IP 감지 시작 (4초 타임아웃)
        var fetchTimeout = setTimeout(function() {
          if (!redirected && !userSelected) {
            console.log('IP API 요청 타임아웃 (4초)');
            // fallback 타이머가 5초 후 /home/으로 리다이렉트할 것임
          }
        }, 4000);
        
        fetch('https://ipapi.co/json/', {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
          }
        })
          .then(response => {
            clearTimeout(fetchTimeout);
            if (!response.ok) {
              throw new Error('Network response was not ok');
            }
            return response.json();
          })
          .then(data => {
            if (!redirected && !userSelected) {
              console.log('IP API response:', data);
              
              if (!data || !data.country_code) {
                throw new Error('Invalid API response');
              }
              
              var country = data.country_code;
              console.log('감지된 국가:', country);
              
              // 지역별 언어 설정
              switch(country) {
                case 'KR': // 한국
                  detectedLang = 'ko';
                  break;
                case 'CN': // 중국
                case 'TW': // 대만
                case 'HK': // 홍콩
                  detectedLang = 'cn';
                  break;
                case 'JP': // 일본
                  detectedLang = 'jp';
                  break;
                case 'DE': // 독일
                case 'AT': // 오스트리아
                case 'CH': // 스위스
                case 'LI': // 리히텐슈타인
                case 'LU': // 룩셈부르크
                case 'BE': // 벨기에
                  detectedLang = 'de';
                  break;
                case 'ES': // 스페인
                case 'MX': // 멕시코
                case 'AR': // 아르헨티나
                case 'CO': // 콜롬비아
                case 'CL': // 칠레
                case 'PE': // 페루
                case 'VE': // 베네수엘라
                case 'EC': // 에콰도르
                case 'GT': // 과테말라
                case 'CU': // 쿠바
                case 'BO': // 볼리비아
                case 'DO': // 도미니카 공화국
                case 'HN': // 온두라스
                case 'PY': // 파라과이
                case 'SV': // 엘살바도르
                case 'NI': // 니카라과
                case 'CR': // 코스타리카
                case 'PA': // 파나마
                case 'UY': // 우루과이
                case 'PR': // 푸에르토리코
                  detectedLang = 'es';
                  break;
                default:
                  detectedLang = 'en'; // 기본 영어
                  break;
              }
              
              console.log('선택된 언어:', detectedLang);
              
              // fallback 타이머 취소 후 리다이렉트
              clearTimeout(fallbackTimeout);
              redirectToLanguageSite(detectedLang);
            }
          })
          .catch(error => {
            clearTimeout(fetchTimeout);
            console.log('IP 감지 실패:', error);
            // fallback 타이머가 5초 후 /home/으로 리다이렉트할 것임
          });
      })();
    </script>
  </head>

    <!-- 언어 선택 모달 -->
    <div id="languageModal" class="modal-overlay">
      <div class="modal-content">
        <h2 id="modalTitle">Select Language</h2>
        <p id="modalMessage">We detected your location.</p>
        
        <div class="modal-buttons">
          <a id="recommendedBtn" href="#" class="modal-btn">Go to Recommended Site</a>
        </div>
        
        <div class="other-languages">
          <p id="otherLangTitle">Choose Other Language</p>
          <a id="koLink" href="https://www.mekeng.com/home/" class="lang-link">🇰🇷 한국어</a>
          <a id="jpLink" href="https://www.mekeng.com/jp/" class="lang-link">🇯🇵 日本語</a>
          <a id="cnLink" href="https://www.mekeng.com/cn/" class="lang-link">🇨🇳 中文</a>
          <a id="enLink" href="https://www.mekeng.com/en/" class="lang-link">🇺🇸 English</a>
          <a id="esLink" href="https://www.mekeng.com/es/" class="lang-link">🇪🇸 Español</a>

        <!-- <div class="modal-buttons">
          <button onclick="closeModal()" class="modal-btn secondary">Stay on this page</button>

      </div>
    </div>
  </body>
